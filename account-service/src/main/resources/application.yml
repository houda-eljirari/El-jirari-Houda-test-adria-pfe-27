server:
  port: 8081
spring:
  application:
    name: account-service
  config:
    import: optional:configserver:http://localhost:8888
  graphql:
    graphiql:
      enabled: true
  ai:
    mcp:
      server:
        name: account-mcp
        version: 1.0.0
        type: SYNC
eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka