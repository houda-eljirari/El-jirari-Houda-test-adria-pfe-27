server:
    port: 8080
spring:
    application:
        name: gateway-service
    cloud:
        gateway:
            discovery:
                locator:
                    enabled: true
                    lower-case-service-id: true
            routes:
                - id: account
                  uri: lb://account-service
                  predicates:
                      - Path=/api/accounts/**
                - id: transaction
                  uri: lb://transaction-service
                  predicates:
                      - Path=/api/transactions/**
eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka