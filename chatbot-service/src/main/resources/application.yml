server:
  port: 8084
spring:
  application:
    name: chatbot-service
  ai:
    openai:
      base-url: https://api.groq.com/openai
      api-key: ${GROQ_API_KEY}
      chat:
        options:
          model: llama-3.3-70b-versatile
          temperature: 0.2
    mcp:
      client:
        sse:
          connections:
            account:
              url: http://localhost:8081
            transaction:
              url: http://localhost:8082